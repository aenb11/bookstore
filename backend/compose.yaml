services:
  main-db:
    image: postgres:17.7-alpine

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: Abcd!1234
      POSTGRES_DB: bookstore

    ports:
      - "5432:5432"

    volumes:
      - db-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d bookstore"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  db-data:
